version: 2

# Version-update PRs are disabled on purpose: `open-pull-requests-limit: 0`
# stops Dependabot from opening any routine bump PR, while keeping this config
# (grouping, schedule, commit prefixes) documented so it can be re-enabled by
# raising the limit. Visibility into what could be updated comes from two
# non-PR channels instead:
#   - Dependabot ALERTS (repo Settings → Code security) surface *vulnerable*
#     dependencies in the Security tab, with no PR. Keep "Dependabot security
#     updates" OFF so those alerts stay suggestions, not PRs.
#   - `pnpm outdated` (run on demand) lists non-security version drift.
updates:
  # GitHub Actions. All workflow `uses:` are pinned to a commit SHA (with the
  # version in a trailing comment); Dependabot bumps the SHA + comment together.
  # Grouped into one PR per week to keep review load low.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Root pnpm workspace (targate + the private tools/* packages share this
  # lockfile). Keeps the tool's own runtime/dev dependencies patched.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The documentation site is a separate pnpm workspace with its own lockfile.
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

name: Release

# Cut a release by pushing a semver tag, e.g. `git tag v1.0.0 && git push --tags`.
# The published version is taken from the tag — package.json is not bumped by hand.
# workflow_dispatch republishes to npm for a given version (no GitHub Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0), without the leading v"
        required: true

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

# Never run two releases for the same ref at once, and never cancel a release
# that may already be mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Single source of truth for the version: the tag (or the dispatch input),
  # resolved and validated ONCE and consumed by every downstream job.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        # The dispatch input is read from env, never interpolated into the
        # script body — `${{ }}` inside `run:` would let a crafted input inject
        # shell. Read from the environment and quote instead.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Strict semver, no leading v.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::invalid version '$VERSION' (expected semver like 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION"

  # Full gate, then compile the standalone binaries and checksum/sign them.
  # The release re-runs the gate independently — it never trusts another
  # workflow to have verified the tag.
  build:
    name: gate + build binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Pinned bun version → the embedded runtime (and thus the binaries) are
      # reproducible across runs.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - run: pnpm install --frozen-lockfile

      # A failure here stops the release before anything is built or published.
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      - name: Runtime dependency audit
        run: pnpm audit --prod --audit-level high

      # Embed the resolved version into the binaries (package.json is not on
      # disk inside a bun single-file binary — see src/version.ts), then compile.
      - name: Build standalone binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          VERSION="$VERSION" bash scripts/build-binaries.sh

      # Native smoke test of the one target this runner can execute. Loads the
      # binary end to end (catches the "package.json not found" class of bug);
      # offline, so it stays deterministic.
      - name: Smoke-test the linux-x64 binary
        run: |
          ./dist-bin/targate-linux-x64 --help >/dev/null
          echo "linux-x64 binary loads and runs"

      # Detached signature over the aggregate checksums. Skipped gracefully when
      # the signing key is not configured, so the pipeline works before setup.
      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        if: ${{ env.MINISIGN_SECRET_KEY != '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m dist-bin/SHA256SUMS
          rm -f minisign.key
          echo "Signed SHA256SUMS → SHA256SUMS.minisig"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries
          path: |
            dist-bin/targate-*
            dist-bin/SHA256SUMS
            dist-bin/SHA256SUMS.minisig
          if-no-files-found: error
          retention-days: 7

  # Publish the GitHub Release with the binaries, checksums, signature, and
  # auto-generated notes. Tag pushes only — a manual dispatch republishes npm
  # without cutting a GitHub Release.
  github-release:
    name: github release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries
          path: dist-bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          # Not fail-on-unmatched: the .minisig is absent until signing is
          # configured, and the build job already guarantees the binaries exist.
          fail_on_unmatched_files: false
          files: |
            dist-bin/targate-*
            dist-bin/SHA256SUMS
            dist-bin/SHA256SUMS.minisig

  # Render the multi-platform formula from our own checksums and push it to the
  # tap repo. Skipped gracefully until the tap App credentials are configured.
  homebrew:
    name: update homebrew tap
    needs: [version, build]
    # OFF during the pre-1.0 npm soft-launch. The job is kept intact — re-enable
    # trivially by setting the repo variable: `gh variable set PUBLISH_BREW_WINGET
    # --body true` (no code change). Also requires the HOMEBREW_TAP_APP_* secrets.
    if: ${{ vars.PUBLISH_BREW_WINGET == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - id: guard
        env:
          APP_ID: ${{ secrets.HOMEBREW_TAP_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_APP_ID not set — skipping Homebrew tap update"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries
          path: dist-bin

      - if: steps.guard.outputs.enabled == 'true'
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-targate

      - if: steps.guard.outputs.enabled == 'true'
        name: Render and push the formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: bash scripts/update-homebrew.sh

  # Update the winget manifest (bump version/URL/SHA) and open the PR to
  # microsoft/winget-pkgs. The package must be onboarded once by hand first
  # (`wingetcreate new`, InstallerType: portable); this only bumps versions.
  # Skipped gracefully until WINGET_TOKEN is configured.
  winget:
    name: publish to winget
    needs: [version, github-release]
    # OFF during the pre-1.0 npm soft-launch (see the homebrew job). Re-enable with
    # `gh variable set PUBLISH_BREW_WINGET --body true`. Also requires WINGET_TOKEN.
    if: ${{ vars.PUBLISH_BREW_WINGET == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - id: guard
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "WINGET_TOKEN not set — skipping winget publish"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: MarcoAbate.targate
          version: ${{ needs.version.outputs.version }}
          installers-regex: 'targate-windows-x64\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

  # Existing npm publish — unchanged behaviour (provenance via OIDC), but now
  # consuming the shared version output instead of re-deriving it.
  npm:
    name: publish to npm
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      # Pin to npm 11 (NOT @latest): npm 12 requires Node >= 22.22 (this job runs
      # 22.x) and changed `npm pack --json` to an object shape. With no
      # NODE_AUTH_TOKEN and `id-token: write`, npm authenticates to the registry
      # via OIDC against the trusted publisher configured for this package on
      # npmjs.com (repo + workflow), so no long-lived token is stored.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Set version from the resolved release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Provenance (OIDC + Sigstore) can only be issued for a PUBLIC source repo;
      # npm rejects `--provenance` while the repo is private. During the private
      # soft-launch we publish WITHOUT it; the moment the repo is made public the
      # flag re-activates automatically — nothing else to change here.
      # No NODE_AUTH_TOKEN: authentication is via OIDC (Trusted Publishing).
      - name: Publish to npm (provenance auto-enabled once the repo is public)
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_PRIVATE" = "false" ]; then
            echo "Public repo — publishing with provenance."
            npm publish --provenance --access public
          else
            echo "::notice::Repository is private — publishing WITHOUT provenance (it requires a public repo). Provenance activates automatically once the repo is public."
            npm publish --access public
          fi

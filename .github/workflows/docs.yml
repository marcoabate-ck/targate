name: Docs

# Build check for the Astro/Starlight site (landing + docs). Deployment is
# handled by Cloudflare Pages (connected to this repo, serving targate.dev), so
# this workflow only *verifies* the build on every change — it does not deploy.
# The docs dependency tree is itself gated through targate: the tool eats its
# own dog food on its own docs.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: gate + build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # corepack activates the pnpm version pinned in each package.json's
      # `packageManager` field — the repo root and website/ can differ.
      - name: Enable pnpm
        run: corepack enable

      # Build targate from source so the docs tree is gated by the LOCAL
      # version, not a published one.
      - name: Build targate
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install docs dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Gate docs dependencies through targate
        working-directory: website
        # Vets the whole docs dependency tree; exits non-zero on an unapproved
        # or blocked package. Approvals live in website/.targate/approvals.json.
        run: node ../dist/cli.js install --dry-run

      - name: Type-check the site
        working-directory: website
        run: pnpm typecheck

      - name: Test the site (landing timeline model)
        working-directory: website
        run: pnpm test

      - name: Build (TypeDoc API + Astro/Starlight)
        working-directory: website
        run: pnpm build

name: proxy cert e2e

# Verifies the registry proxy's TLS + system-trust path on each OS: setup →
# trust the local CA → HTTPS install without NODE_EXTRA_CA_CERTS → untrust.
# Manual (workflow_dispatch): it modifies the runner's trust store and needs
# network, so it is not part of the per-PR gate. Expect first-run tuning per OS.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-cert-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cert-e2e:
    name: cert e2e · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: proxy TLS + system-trust e2e
        run: node --import tsx scripts/e2e-proxy-cert.mts
        env:
          # CI is non-interactive — exercise the real system-store install too.
          TARGATE_TEST_SYSTEM_TRUST: "1"

# Isolates the docs site as its own pnpm root (separate from the repo
# root workspace), so the main targate dependency gate is unaffected.
# Build scripts pnpm must run for the Astro/Starlight toolchain are approved
# below (pnpm does not run dependency build scripts unless allow-listed).

allowBuilds:
  esbuild: true
  sharp: true

# sharp < 0.35.0 (pulled transitively by astro) is affected by GHSA-f88m-g3jw-g9cj.
# Force the patched line across the tree; 0.35.x is API-compatible with astro's use.
overrides:
  sharp@<0.35.0: ">=0.35.0"

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/markdown-satteri@0.3.5'
  - astro@7.1.5
